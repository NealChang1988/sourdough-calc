<h1>披萨面团计算器</h1>
<p>每种风格有自己的水合、盐和酵母。酸种披萨用酸种，不加酵母。每球重量从这种饼常用的大小开始，小的那不勒斯、大一些的纽约风圆饼，或一份盘烤。球数和每球克数都可以改，计算器会按总重量反推面粉。</p>
