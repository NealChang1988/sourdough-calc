<h1>酸種水合計算</h1>
<p>水合是水的重量除以你秤出的麵粉。65% 柔軟，適合整成切片整齊的吐司。70% 和 75% 會略微塌，前期摺疊後容易做出鄉村麵包那種敞開的組織。80% 很濕，更接近恰巴塔，筋力靠摺疊，不靠在檯面上揉。先選一個百分比，想要別的軟硬再改水合。</p>
